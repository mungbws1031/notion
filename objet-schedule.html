<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Surearly Objet 개발 일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --su-red:#E60044;
    --su-red-soft:#F4A0BB;
    --su-red-wash:#FCEFF3;
    --su-gray:#8A8987;
    --su-gray-soft:#C9C8C6;
    --ink:#1E202C;
    --ink-2:#4A4C58;
    --ink-3:#828490;
    --line:#EAE8E4;
    --line-2:#F1F0EC;
    --paper:#FAFAF7;
    --sans:'Nunito',-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --mono:'Space Mono','SFMono-Regular',Menlo,monospace;
    --gutter:132px;
  }
  *{box-sizing:border-box;}
  html,body{height:auto;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    padding:20px 18px 28px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;}

  /* ---- Notion embed responsive ---- */
  @media (max-width:820px){
    :root{--gutter:104px;}
    body{padding:14px 12px 22px;}
    h1{font-size:22px;}
    .kpis{gap:16px;}
    .kpi .v{font-size:19px;}
    .panel{padding:18px 16px 22px;border-radius:12px;}
    .glabel .n,.row{font-size:13px;}
  }

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--su-red);font-weight:700;margin:0 0 8px;}
  h1{font-size:28px;font-weight:900;margin:0 0 8px;letter-spacing:-0.025em;line-height:1.1;}
  .sub{font-size:13.5px;color:var(--ink-2);font-weight:600;}
  .sub .mono{font-family:var(--mono);font-weight:400;font-size:12.5px;}

  /* KPI */
  .kpis{display:flex;gap:26px;margin:22px 0 30px;flex-wrap:wrap;}
  .kpi{display:flex;flex-direction:column;gap:3px;}
  .kpi .v{font-family:var(--mono);font-size:23px;font-weight:700;line-height:1;color:var(--ink);}
  .kpi .v .u{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-3);margin-left:2px;}
  .kpi.accent .v{color:var(--su-red);}
  .kpi .l{font-size:11.5px;font-weight:700;color:var(--ink-3);}
  .kpi .sep{width:1px;align-self:stretch;background:var(--line);}

  /* card */
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 28px 30px;}

  /* axis */
  .chart{position:relative;min-width:640px;}
  .chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .axis{display:grid;grid-template-columns:var(--gutter) 1fr;margin-bottom:32px;}
  .axis .plot{position:relative;height:22px;}
  .axis .mo{position:absolute;top:0;font-family:var(--mono);font-size:11px;font-weight:700;
    color:var(--ink-3);transform:translateX(-2px);}
  .axis .mo .en{font-weight:400;font-size:9px;margin-left:3px;}

  .plotwrap{display:grid;grid-template-columns:var(--gutter) 1fr;}
  .gutter{display:grid;grid-auto-rows:62px;row-gap:26px;}
  .plot{position:relative;display:grid;grid-auto-rows:62px;row-gap:26px;}

  /* gridlines + focus band + today (overlay, full height) */
  .overlay{position:absolute;inset:0;pointer-events:none;z-index:0;}
  .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2);}
  .focus{position:absolute;top:0;bottom:0;background:var(--su-red-wash);opacity:.55;border-radius:6px;}
  .focus-tag{position:absolute;top:-19px;font-family:var(--mono);font-size:9.5px;font-weight:700;
    color:var(--su-red);transform:translateX(-50%);white-space:nowrap;}
  .today{position:absolute;top:0;bottom:0;width:2px;background:var(--su-red);z-index:6;}
  .today .pin{position:absolute;top:-22px;left:1px;transform:translateX(-50%);
    font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:var(--su-red);
    padding:2px 7px;border-radius:5px;white-space:nowrap;}

  /* rows */
  .glabel{height:62px;display:flex;flex-direction:column;justify-content:center;gap:3px;
    padding-right:14px;position:relative;}
  .glabel::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;}
  .glabel.red::before{background:var(--su-red);}
  .glabel.gray::before{background:var(--su-gray);}
  .glabel .n{font-size:14.5px;font-weight:800;letter-spacing:-0.01em;padding-left:12px;}
  .glabel .p{font-family:var(--mono);font-size:9px;color:var(--ink-3);padding-left:12px;}

  .row{height:62px;position:relative;z-index:1;}
  .bar{position:absolute;top:50%;transform:translateY(-50%);height:22px;border-radius:11px;z-index:1;}
  .bar.red{background:var(--su-red-wash);border:1px solid var(--su-red-soft);}
  .bar.gray{background:#F0F0EE;border:1px solid var(--su-gray-soft);}

  .step{position:absolute;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;
    z-index:3;cursor:default;}
  .step.red{background:var(--su-red);}
  .step.gray{background:var(--su-gray);}
  .step.overdue{box-shadow:0 0 0 3px var(--su-red-wash),0 0 0 4px var(--su-red);}

  /* phase segment (기간형 항목) */
  .phase{position:absolute;top:50%;transform:translateY(-50%);height:15px;border-radius:8px;z-index:2;
    cursor:pointer;transition:filter .12s;}
  .phase:hover{filter:brightness(.95);}
  .phase.red{background:var(--su-red);opacity:.82;}
  .phase.gray{background:var(--su-gray);opacity:.82;}
  .phase.sel{outline:2px solid #fff;box-shadow:0 0 0 4px var(--su-red);opacity:1;}
  .phase.overdue{background:repeating-linear-gradient(45deg,var(--su-red),var(--su-red) 5px,#c8003b 5px,#c8003b 10px);opacity:1;}
  .phaselab{position:absolute;bottom:calc(50% + 12px);transform:translateX(-50%);text-align:center;
    white-space:nowrap;z-index:5;pointer-events:none;}
  .phaselab .t{font-size:10.5px;font-weight:800;color:var(--ink);}
  .phaselab .d{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--ink-3);display:block;}
  .phaselab.below{bottom:auto;top:calc(50% + 12px);}

  .ms{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(45deg);
    width:14px;height:14px;background:var(--ink);border:2px solid var(--su-red);z-index:4;border-radius:2px;}
  .mslabel{position:absolute;bottom:calc(50% + 15px);transform:translateX(-50%);
    text-align:center;white-space:nowrap;z-index:5;}
  .mslabel .d{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--su-red);display:block;}
  .mslabel .t{font-size:11px;font-weight:800;color:var(--ink);}
  .mslabel.edge{transform:translateX(-88%);text-align:right;}
  .mslabel.edge.l{transform:translateX(-12%);text-align:left;}

  /* start marker label (first step gets a date under bar) */
  .startlab{position:absolute;top:calc(50% + 16px);transform:translateX(-50%);
    font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--ink-3);white-space:nowrap;z-index:5;}
  .startlab.l{transform:translateX(-8%);}

  /* tbd chip on the bar */
  .tbdchip{position:absolute;top:50%;transform:translateY(-50%);height:20px;
    display:flex;align-items:center;gap:4px;padding:0 8px;border-radius:10px;z-index:3;
    background:#fff;border:1px dashed var(--su-red-soft);
    font-family:var(--mono);font-size:9px;font-weight:700;color:var(--su-red);white-space:nowrap;}

  /* clickable markers */
  .step,.ms,.mslabel,.tbdchip{cursor:pointer;}
  .step{transition:box-shadow .12s,transform .12s;}
  .step:hover{transform:translate(-50%,-50%) scale(1.35);}
  .ms{transition:transform .12s;}
  .ms:hover{transform:translate(-50%,-50%) rotate(45deg) scale(1.15);}
  .step.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--su-red)!important;transform:translate(-50%,-50%) scale(1.3);}
  .ms.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--su-red);}

  /* detail panel */
  .detail{margin-top:20px;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    background:#fff;display:none;}
  .detail.on{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .detail .bar-strip{height:5px;}
  .detail .bar-strip.red{background:var(--su-red);}
  .detail .bar-strip.gray{background:var(--su-gray);}
  .detail .body{padding:18px 22px 20px;}
  .detail .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .detail .chip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;
    padding:3px 9px;border-radius:6px;}
  .detail .chip.trk{background:var(--line-2);color:var(--ink-2);}
  .detail .chip.date{background:var(--su-red-wash);color:var(--su-red);}
  .detail .chip.ms{background:var(--ink);color:#fff;}
  .detail .chip.ov{background:var(--su-red);color:#fff;}
  .detail .close{margin-left:auto;border:none;background:none;cursor:pointer;color:var(--ink-3);
    font-size:20px;line-height:1;padding:2px 6px;border-radius:6px;font-family:var(--sans);}
  .detail .close:hover{background:var(--line-2);color:var(--ink);}
  .detail h3{font-size:17px;font-weight:800;margin:0 0 10px;letter-spacing:-0.01em;line-height:1.35;}
  .detail .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px;}
  .detail .m{display:flex;flex-direction:column;gap:3px;}
  .detail .m .mk{font-size:10.5px;font-weight:700;color:var(--ink-3);}
  .detail .m .mv{font-size:13px;font-weight:700;color:var(--ink);}
  .detail .note{margin-top:14px;padding-top:13px;border-top:1px solid var(--line-2);
    font-size:12.5px;color:var(--ink-2);line-height:1.6;font-weight:600;}
  .detail .note b{color:var(--su-red);}
  .detail .hint{margin-top:12px;font-size:11px;color:var(--ink-3);font-weight:600;}
  .detail .seq{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .detail .seq .sq{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
    background:var(--line-2);color:var(--ink-3);cursor:pointer;transition:background .12s;}
  .detail .seq .sq:hover{background:var(--su-red-wash);color:var(--su-red);}
  .detail .seq .sq.cur{background:var(--su-red);color:#fff;}
  .detail .seq .arw{color:var(--line);font-size:10px;}

  /* legend / footer */
  .leg{display:flex;gap:24px;flex-wrap:wrap;margin-top:24px;font-size:11.5px;color:var(--ink-3);font-weight:700;}
  .leg .i{display:flex;align-items:center;gap:8px;}
  .leg .dia{width:12px;height:12px;background:var(--ink);border:2px solid var(--su-red);transform:rotate(45deg);border-radius:2px;flex:none;}
  .leg .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .leg .dot.r{background:var(--su-red);}.leg .dot.g{background:var(--su-gray);}
  .leg .ov{width:11px;height:11px;border-radius:50%;background:var(--su-red);box-shadow:0 0 0 2px var(--su-red-wash),0 0 0 3px var(--su-red);flex:none;}
  .leg .tl{width:2px;height:14px;background:var(--su-red);flex:none;}

  footer{margin-top:18px;font-size:12px;color:var(--ink-3);line-height:1.8;font-weight:600;}
  footer .ast{color:var(--su-red);font-weight:700;}footer b{color:var(--ink-2);}
</style>
</head>
<body>

/* ---- KPI ---- */
const all=tracks.flatMap(t=>t.items);
document.getElementById('trackCount').textContent=tracks.length;
const allBounds=all.flatMap(i=>[parse(i.date), parse(i.end||i.date)]);
const spanDays=Math.round((Math.max(...allBounds)-Math.min(...allBounds))/864e5);
const kpis=[
  {v:all.length,u:'개',l:'전체 항목'},
  {v:all.filter(i=>i.done).length,u:'개',l:'완료 마일스톤'},
  {v:spanDays,u:'일',l:'전체 기간'},
  {v:all.filter(i=>parse(i.date)<=TODAY).length,u:'개',l:'기한 도래',accent:true},
];
const kEl=document.getElementById('kpis');
kpis.forEach((k,i)=>{
  if(i)kEl.insertAdjacentHTML('beforeend','<div class="sep"></div>');
  kEl.insertAdjacentHTML('beforeend',
    `<div class="kpi${k.accent?' accent':''}"><div class="v">${k.v}<span class="u">${k.u}</span></div><div class="l">${k.l}</div></div>`);
});

/* ---- axis months ---- */
const axisEl=document.getElementById('axis');
[[7,'JUL'],[8,'AUG'],[9,'SEP'],[10,'OCT'],[11,'NOV']].forEach(([m,en])=>{
  const p=pctDate(new Date(2026,m-1,1));
  if(p<0||p>100)return;
  axisEl.insertAdjacentHTML('beforeend',`<div class="mo" style="left:${p}%">${m}월<span class="en">${en}</span></div>`);
});

/* ---- overlay: gridlines, focus band, today ---- */
const ov=document.getElementById('overlay');
[8,9,10,11].forEach(m=>{
  const p=pctDate(new Date(2026,m-1,1));
  ov.insertAdjacentHTML('beforeend',`<div class="gl" style="left:${p}%"></div>`);
});
// focus band = October (crunch month)
const fL=pctDate(new Date(2026,9,1)), fR=pctDate(new Date(2026,10,1));
ov.insertAdjacentHTML('beforeend',`<div class="focus" style="left:${fL}%;width:${fR-fL}%"></div>`);
ov.insertAdjacentHTML('beforeend',`<div class="focus-tag" style="left:${(fL+fR)/2}%">10월 집중</div>`);
// today
const tp=pctDate(TODAY);
ov.insertAdjacentHTML('beforeend',`<div class="today" style="left:${tp}%"><span class="pin">오늘 7/24</span></div>`);

/* ---- rows ---- */
const gut=document.getElementById('gutter');
const plot=document.getElementById('plot');
tracks.forEach((track,ti)=>{
  gut.insertAdjacentHTML('beforeend',
    `<div class="glabel ${track.color}"><span class="n">${track.name}</span><span class="p">${track.proj}</span></div>`);

  const row=document.createElement('div');
  row.className='row';
  const ps=track.items.map(i=>pct(i.date));
  const pe=track.items.map(i=>pct(i.end||i.date));
  const L=Math.min(...ps), R=Math.max(...pe);
  const bar=document.createElement('div');
  bar.className='bar '+track.color;
  bar.style.left=L+'%'; bar.style.width=(R-L)+'%';
  row.appendChild(bar);

  if(!track.phase){
    const firstP=ps[0];
    const sl=document.createElement('div');
    sl.className='startlab'+(firstP<6?' l':'');
    sl.style.left=firstP+'%';
    sl.textContent=track.items[0].date.replace('2026/','').replace('/','.');
    row.appendChild(sl);
  }

  track.items.forEach((it,idx)=>{
    const p=ps[idx];
    const overdue=(it.end?parse(it.end):parse(it.date))<=TODAY ? (parse(it.date)<=TODAY) : false;
    const startOverdue=parse(it.date)<=TODAY;
    const dd=it.date.replace('2026/','').replace('/','.');

    if(it.end){
      // phase segment
      const pEnd=pe[idx];
      const seg=document.createElement('div');
      const segOverdue=parse(it.end)<=TODAY;
      seg.className='phase '+track.color+(segOverdue?' overdue':'');
      seg.style.left=p+'%';seg.style.width=(pEnd-p)+'%';
      seg.dataset.t=ti;seg.dataset.i=idx;
      row.appendChild(seg);
      const lab=document.createElement('div');
      lab.className='phaselab'+((track.labelBelow||idx%2)?' below':'');
      lab.style.left=((p+pEnd)/2)+'%';
      lab.dataset.t=ti;lab.dataset.i=idx;
      const ed=it.end.replace('2026/','').replace('/','.');
      lab.innerHTML=`<span class="t">${it.short||it.task}</span><span class="d">${dd}–${ed}</span>`;
      row.appendChild(lab);
    }else if(it.done){
      const dia=document.createElement('div');
      dia.className='ms';dia.style.left=p+'%';
      dia.dataset.t=ti;dia.dataset.i=idx;
      row.appendChild(dia);
      const lab=document.createElement('div');
      let cls='mslabel'; if(p>85)cls+=' edge'; else if(p<10)cls+=' edge l';
      lab.className=cls;lab.style.left=p+'%';
      lab.dataset.t=ti;lab.dataset.i=idx;
      lab.innerHTML=`<span class="d">${dd}</span><span class="t">${it.short||it.task}</span>`;
      row.appendChild(lab);
    }else{
      const s=document.createElement('div');
      s.className='step '+track.color+(startOverdue?' overdue':'');
      s.style.left=p+'%';
      s.dataset.t=ti;s.dataset.i=idx;
      row.appendChild(s);
      if(track.phase){
        // labeled point (e.g. deadline) inside a phase track
        const lab=document.createElement('div');
        lab.className='phaselab'+((track.labelBelow||idx%2)?' below':'');
        lab.style.left=p+'%';
        lab.dataset.t=ti;lab.dataset.i=idx;
        lab.innerHTML=`<span class="t">${it.short||it.task}</span><span class="d">~${dd}</span>`;
        row.appendChild(lab);
      }
    }
  });

  if(track.tbd){
    const c=document.createElement('div');
    c.className='tbdchip';
    const p=pct(track.tbd.at);
    c.style.left=p+'%';c.style.transform='translate(-50%,-50%)';
    c.textContent=track.tbd.label;
    c.dataset.t=ti;c.dataset.tbd='1';
    row.appendChild(c);
  }

  plot.appendChild(row);
});

/* ---- click → detail panel ---- */
const detail=document.getElementById('detail');
let selEl=null;

function clearSel(){ if(selEl){selEl.classList.remove('sel');selEl=null;} }

function showStep(ti,idx,markerEl){
  const track=tracks[ti], it=track.items[idx];
  const isPhase=!!it.end;
  const refEnd=it.end?parse(it.end):parse(it.date);
  const overdue=isPhase?(parse(it.date)<=TODAY):(parse(it.date)<=TODAY);
  const dd=it.date.replace('2026/','').replace('/','.');
  const ed=it.end?it.end.replace('2026/','').replace('/','.'):null;
  const wd=['일','월','화','수','목','금','토'][parse(it.date).getDay()];

  const chips=[`<span class="chip trk">${track.name} · ${track.proj}</span>`];
  if(isPhase) chips.push(`<span class="chip date">${dd} – ${ed}</span>`);
  else chips.push(`<span class="chip date">${dd} (${wd})${it.deadline?' 마감':''}</span>`);
  if(it.done)chips.push(`<span class="chip ms">◆ 마일스톤</span>`);
  if(overdue && !it.done)chips.push(`<span class="chip ov">${isPhase?'진행 중·시작 도래':'기한 도래·경과'}</span>`);

  const seq=track.items.map((s,j)=>{
    const sd=s.date.replace('2026/','').replace('/','.');
    return `<span class="sq${j===idx?' cur':''}" data-t="${ti}" data-i="${j}">${sd}</span>`;
  }).join('<span class="arw">→</span>');

  const dateRow=isPhase
    ? `<div class="m"><span class="mk">기간</span><span class="mv">2026.${dd} – ${ed}</span></div>
       <div class="m"><span class="mk">소요</span><span class="mv">${Math.round((refEnd-parse(it.date))/864e5)}일</span></div>`
    : `<div class="m"><span class="mk">${it.deadline?'마감일':'계획일'}</span><span class="mv">2026.${dd}</span></div>
       <div class="m"><span class="mk">완료일</span><span class="mv">미기재</span></div>`;

  detail.className='detail on '+track.color;
  detail.innerHTML=
    `<div class="bar-strip ${track.color}"></div>
     <div class="body">
       <div class="top">${chips.join('')}<button class="close" aria-label="닫기">×</button></div>
       <h3>${it.task}</h3>
       <div class="meta">
         ${dateRow}
         <div class="m"><span class="mk">단계</span><span class="mv">${it.stage||'—'}</span></div>
         <div class="m"><span class="mk">진행 상태</span><span class="mv">미기재</span></div>
       </div>
       ${it.note?`<div class="note">${it.note}</div>`:''}
       <div class="hint">이 트랙의 순서 (클릭 이동):</div>
       <div class="seq">${seq}</div>
     </div>`;
  if(detail.scrollIntoView)detail.scrollIntoView({behavior:'smooth',block:'nearest'});
  clearSel();
  if(markerEl){markerEl.classList.add('sel');selEl=markerEl;}
}

function showTbd(ti){
  const track=tracks[ti];
  detail.className='detail on '+track.color;
  detail.innerHTML=
    `<div class="bar-strip ${track.color}"></div>
     <div class="body">
       <div class="top">
         <span class="chip trk">${track.name} · ${track.proj}</span>
         <span class="chip ov">일정 미확정</span>
         <button class="close" aria-label="닫기">×</button>
       </div>
       <h3>미확정 항목 · 필요시 진행</h3>
       <div class="note">${track.tbd.detail}</div>
     </div>`;
  if(detail.scrollIntoView)detail.scrollIntoView({behavior:'smooth',block:'nearest'});
  clearSel();
}

document.addEventListener('click',e=>{
  const close=e.target.closest('.close');
  if(close){detail.className='detail';clearSel();return;}
  const sq=e.target.closest('.seq .sq');
  if(sq){
    const ti=+sq.dataset.t, idx=+sq.dataset.i;
    const marker=plot.querySelector(`.step[data-t="${ti}"][data-i="${idx}"], .ms[data-t="${ti}"][data-i="${idx}"], .phase[data-t="${ti}"][data-i="${idx}"]`);
    showStep(ti,idx,marker);return;
  }
  const m=e.target.closest('.step,.ms,.mslabel,.phase,.phaselab,.tbdchip');
  if(!m)return;
  if(m.dataset.tbd){showTbd(+m.dataset.t);return;}
  const ti=+m.dataset.t, idx=+m.dataset.i;
  // if a label clicked, highlight its marker
  let marker=m;
  if(m.classList.contains('mslabel')){
    marker=plot.querySelector(`.ms[data-t="${ti}"][data-i="${idx}"]`);
  }else if(m.classList.contains('phaselab')){
    marker=plot.querySelector(`.phase[data-t="${ti}"][data-i="${idx}"], .step[data-t="${ti}"][data-i="${idx}"]`);
  }
  showStep(ti,idx,marker);
});
</script>
