<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBJET 개발 컨트롤타워</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --su-red:#E60044;--su-red-l:#FFF0F5;--bg:#F3F4F6;--surface:#fff;
  --border:#E4E6EA;--border-s:#CBD0D8;--text1:#111827;--text2:#4B5563;--text3:#9CA3AF;
  --done-c:#15803D;--done-bg:#DCFCE7;--prog-c:#1D4ED8;--prog-bg:#DBEAFE;
  --wait-c:#6B7280;--wait-bg:#F3F4F6;--blk-c:#DC2626;--blk-bg:#FEE2E2;
  --gate-c:#92400E;--gate-bg:#FEF3C7;
  --r:10px;--rs:6px;
  --mono:'Space Mono','Courier New',monospace;
  --sans:'Pretendard Variable','Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sh:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer}
body{font-family:var(--sans);background:var(--bg);color:var(--text1);font-size:13px;line-height:1.5;padding:14px;max-width:980px;margin:0 auto}

/* Header */
.hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px}
.hdr-bar{width:5px;height:36px;background:var(--su-red);border-radius:3px;flex-shrink:0}
.hdr-title{font-size:15px;font-weight:800;letter-spacing:-.02em}
.hdr-sub{font-size:11px;color:var(--text2)}
.hdr-r{margin-left:auto;text-align:right}
.today-pill{display:inline-flex;align-items:center;gap:5px;background:var(--su-red);color:#fff;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;font-family:var(--mono)}
.d1w{margin-top:4px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--su-red);background:var(--su-red-l);padding:2px 8px;border-radius:10px;display:inline-block}

/* KPI */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.kc{background:var(--surface);border-radius:var(--rs);box-shadow:var(--sh);padding:12px 14px}
.kc-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.kc-val{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1;margin-bottom:2px}
.kc-sub{font-size:10px;color:var(--text2)}
.kc.red .kc-val{color:var(--su-red)}
.kc.grn .kc-val{color:var(--done-c)}
.kc.blu .kc-val{color:var(--prog-c)}

/* Filter bar */
.fb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 14px;background:var(--surface);border-radius:var(--rs);box-shadow:var(--sh);margin-bottom:10px}
.fg{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.fl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.fc{background:none;border:1.5px solid var(--border);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;color:var(--text2);transition:all .12s}
.fc:hover{border-color:var(--su-red);color:var(--su-red)}
.fc.on{background:var(--su-red);border-color:var(--su-red);color:#fff}
.fsep{width:1px;height:18px;background:var(--border);margin:0 2px}
.vg{margin-left:auto;display:flex;gap:4px}
.vb{background:none;border:1.5px solid var(--border);border-radius:var(--rs);padding:4px 10px;font-size:11px;font-weight:600;color:var(--text2);transition:all .12s}
.vb:hover{border-color:var(--su-red);color:var(--su-red)}
.vb.on{background:var(--text1);border-color:var(--text1);color:#fff}
.clr{font-size:10px;color:var(--text3);border:none;background:none;padding:2px 6px;border-radius:8px}
.clr:hover{background:var(--border)}

/* Alert */
.alert{background:var(--su-red-l);border:1.5px solid var(--su-red);border-radius:var(--rs);padding:9px 14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
.al-txt{font-size:12px;font-weight:600;color:var(--su-red);line-height:1.5}
.al-txt span{font-weight:400;color:#7F1D1D}

/* Card */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.ch{display:flex;align-items:center;gap:7px;padding:9px 14px;background:#F9FAFB;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.cb{padding:14px}

/* Gates */
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gb{width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rs);padding:11px 13px;transition:border-color .12s,box-shadow .12s,background .12s}
.gb:hover{border-color:var(--su-red);box-shadow:0 0 0 2px rgba(230,0,68,.1)}
.gb.on{border-color:var(--su-red);background:var(--su-red-l);box-shadow:0 0 0 3px rgba(230,0,68,.12)}
.gr{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.gl{font-size:13px;font-weight:700}
.stag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.stag.ok{background:var(--done-bg);color:var(--done-c)}
.stag.pend{background:var(--gate-bg);color:var(--gate-c)}
.gn{font-size:11px;color:var(--text2);line-height:1.4}
.ga{font-size:10px;color:var(--su-red);font-weight:600;margin-top:6px}

/* Timeline */
.tl{padding:4px 0 8px}
.tlw{position:relative;height:48px;margin:0 0 6px}
.tlt{position:absolute;top:24px;left:0;right:0;height:8px;background:var(--border);border-radius:4px;overflow:visible}
.tls{position:absolute;height:100%;border-radius:4px;top:0}
.tld{position:absolute;top:-18px;width:2px;background:var(--su-red);border-radius:1px;z-index:10}
.tld-tip{position:absolute;top:-18px;transform:translateX(-50%);background:var(--su-red);color:#fff;font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;white-space:nowrap}
.tlm{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%)}
.tlm-id{font-size:9px;font-family:var(--mono);font-weight:700;white-space:nowrap}
.tlm-dot{width:10px;height:10px;border-radius:50%;border:2px solid #fff;z-index:5;margin:1px 0}
.tlm-dt{font-family:var(--mono);font-size:8px;color:var(--text3)}
.tlr{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--text3)}
.pcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pc{border:1.5px solid var(--border);border-radius:var(--rs);padding:10px 12px;position:relative}
.pc.cur{border-color:var(--su-red);background:linear-gradient(135deg,var(--su-red-l) 0%,#fff 100%)}
.pc-id{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.04em}
.pc-nm{font-size:11px;color:var(--text2);margin-bottom:1px}
.pc-sb{font-size:10px;color:var(--text3);margin-bottom:8px}
.pc-due{font-family:var(--mono);font-size:10px;margin-bottom:8px}
.pc-due.urg{color:var(--su-red);font-weight:700}
.pw{background:var(--border);height:5px;border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px}
.pp{font-family:var(--mono);font-size:11px;font-weight:700;text-align:right;margin-top:3px}
.ra{position:absolute;top:10px;right:10px;font-size:16px}

/* Swim lane */
.pgl{padding:8px 14px 4px;font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;border-top:1px solid var(--border)}
.pgl:first-child{border-top:none}
.sl{border-bottom:1px solid var(--border)}
.sl:last-child{border-bottom:none}
.lh{display:flex;align-items:center;gap:7px;padding:7px 14px;background:#FAFAFA;border-bottom:1px solid var(--border)}
.vd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.vn{font-weight:700;font-size:12px}
.pp2{font-size:9px;padding:1px 5px;border-radius:8px;background:var(--border);color:var(--text3);font-family:var(--mono)}
.bw{font-size:10px;color:var(--su-red);font-weight:700}
.tc2{margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono)}
.lb{padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px}
.uw{padding:8px 14px 12px;border-top:1px dashed var(--border)}
.ul{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.ut{display:flex;flex-wrap:wrap;gap:8px}

/* Task card */
.tk{border:1.5px solid var(--border);border-radius:var(--rs);padding:9px 10px;min-width:150px;max-width:215px;flex:1 1 150px;transition:border-color .12s,box-shadow .12s;position:relative}
.tk.hl{border-color:var(--su-red)!important;box-shadow:0 0 0 3px rgba(230,0,68,.15)}
.tk.s-done{border-left:3px solid var(--done-c)}
.tk.s-in-progress{border-left:3px solid var(--prog-c)}
.tk.s-waiting{border-left:3px solid var(--border-s)}
.tk.s-blocked{border-left:3px solid var(--su-red)}
.tk.cp{outline:1.5px dashed #F59E0B;outline-offset:1px}
.tk-top{display:flex;align-items:center;gap:4px;margin-bottom:5px}
.sc{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px}
.sc.done{background:var(--done-bg);color:var(--done-c)}
.sc.in-progress{background:var(--prog-bg);color:var(--prog-c)}
.sc.waiting{background:var(--wait-bg);color:var(--wait-c)}
.sc.blocked{background:var(--blk-bg);color:var(--blk-c)}
.sc-qty{font-size:9px;font-family:var(--mono);color:var(--text3)}
.tka{margin-left:auto;display:flex;gap:2px}
.ib{background:none;border:none;font-size:11px;color:var(--text3);padding:1px 3px;border-radius:3px}
.ib:hover{background:var(--border);color:var(--text2)}
.tk-lbl{font-size:12px;font-weight:500;line-height:1.4}
.tk-meta{display:flex;align-items:center;gap:5px;margin-top:3px}
.tk-ph{font-size:9px;font-family:var(--mono);color:var(--text3)}
.tk-cp{font-size:9px;color:#D97706;font-weight:700}
.tk-upd{font-size:9px;color:var(--text3);font-family:var(--mono)}
.blk{display:flex;align-items:flex-start;gap:4px;background:var(--blk-bg);border-radius:4px;padding:4px 6px;margin-top:6px;font-size:10px;color:#7F1D1D;line-height:1.4}
.gba{display:inline-flex;align-items:center;gap:3px;background:var(--gate-bg);color:var(--gate-c);border-radius:4px;padding:2px 5px;font-size:9px;font-weight:700;margin-top:5px}
.na{margin-top:7px;border-top:1px solid var(--border);padding-top:6px}
.nl{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.nd{font-size:11px;color:var(--text2);cursor:pointer}
.nd:hover{text-decoration:underline dotted}
.ni{width:100%;border:1px solid var(--border);border-radius:4px;padding:5px 7px;font-size:11px;font-family:var(--sans);resize:vertical;min-height:44px;outline:none}
.ni:focus{border-color:var(--su-red)}
.ns{margin-top:4px;font-size:10px;background:var(--su-red);color:#fff;border:none;border-radius:4px;padding:3px 8px}

/* Gantt */
.gw{overflow-x:auto;padding:14px}
.g-hdr{display:flex;margin-bottom:4px;margin-left:200px}
.g-mo{flex:1;text-align:center;font-size:9px;font-family:var(--mono);color:var(--text3);font-weight:700;border-left:1px solid var(--border);padding:2px 0}
.g-row{display:flex;align-items:center;min-height:30px;border-bottom:1px solid var(--border);padding:2px 0}
.g-row:hover{background:#F9FAFB}
.g-row.g-sep{background:#F3F4F6;border-top:2px solid var(--border);min-height:22px}
.g-lbl{width:200px;flex-shrink:0;display:flex;align-items:center;gap:5px;padding-right:8px;overflow:hidden}
.g-lt{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.g-trk{flex:1;position:relative;height:22px}
.g-bar{position:absolute;height:16px;top:3px;border-radius:3px;display:flex;align-items:center;padding:0 5px;font-size:8px;color:#fff;font-weight:700;overflow:hidden;white-space:nowrap;min-width:4px}
.g-td{position:absolute;top:0;bottom:0;width:2px;background:var(--su-red);z-index:5;pointer-events:none}

/* List */
.ltb{width:100%;border-collapse:collapse}
.ltb th{text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border-bottom:2px solid var(--border);background:#FAFAFA}
.ltb td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.ltb tr:hover td{background:#F9FAFB}
.ltb tr.s-b td:first-child{border-left:3px solid var(--su-red)}
.ltb tr.s-p td:first-child{border-left:3px solid var(--prog-c)}

/* Activity */
.at-btn{width:100%;text-align:left;background:var(--surface);border:none;border-radius:var(--rs);padding:9px 14px;font-size:11px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:6px;box-shadow:var(--sh);margin-bottom:0}
.at-btn:hover{background:#F3F4F6}
.at-cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text3)}
.al-box{background:var(--surface);border-radius:0 0 var(--rs) var(--rs);border-top:1px solid var(--border);max-height:200px;overflow-y:auto;box-shadow:var(--sh);margin-bottom:10px}
.ai{display:flex;align-items:flex-start;gap:8px;padding:7px 14px;border-bottom:1px solid var(--border);font-size:11px}
.ai:last-child{border-bottom:none}
.ai-t{font-family:var(--mono);font-size:10px;color:var(--text3);white-space:nowrap;flex-shrink:0;margin-top:1px}
.ai-f{text-decoration:line-through;color:var(--text3)}
.ai-to{font-weight:700}
.ai-to.done{color:var(--done-c)}
.ai-to.in-progress{color:var(--prog-c)}
.ai-to.waiting{color:var(--wait-c)}
.ai-to.blocked{color:var(--blk-c)}

/* Legend */
.lgd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);background:#FAFAFA}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2)}

@media(max-width:640px){
  .kpi{grid-template-columns:1fr 1fr}
  .gg{grid-template-columns:1fr}
  .pcs{grid-template-columns:1fr}
  .vg{margin-left:0;width:100%}
}
</style>
</head>

  {id:'t15',phase:'D2',owner:'designsidae',  label:'파우치·포장 케이스 디자인·제작',   status:'waiting',    dependsOn:[],       qty:null,  gate:null,        blocker:null,                           est:{s:'2026-07-01',e:'2026-08-15'}},
  {id:'t16',phase:'D2',owner:'ghosdesign',   label:'GUI 외주 개발',                  status:'waiting',    dependsOn:[],       qty:null,  gate:'gui-vendor', blocker:null,                          est:{s:'2026-07-15',e:'2026-08-30'}},
  {id:'t17',phase:'D2',owner:null,           label:'NFC 적용 여부 재결정 (D2)',       status:'waiting',    dependsOn:[],       qty:null,  gate:'nfc',       blocker:'← 적용 시 전체 일정 변경',       est:{s:'2026-07-01',e:'2026-07-15'}}
];
const CP=new Set(['t03','t10','t11','t08','t09','t07']); // critical path

// ── STATE ──
const S={activeGate:null,view:'swim',noteOpen:null,showLog:false,filters:{status:'all',vendor:'all',phase:'all'}};

// ── STORAGE ──
const ls=(k,v)=>{try{v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
const lg=(k)=>{try{return localStorage.getItem(k)}catch(e){return null}};
function getSt(t){return lg('ob_s_'+t.id)||t.status}
function getNote(id){return lg('ob_n_'+id)||''}
function getUpd(id){return lg('ob_u_'+id)}
function logAct(tid,from,to){
  const t=TASKS.find(x=>x.id===tid);if(!t)return;
  try{const l=JSON.parse(lg('ob_log')||'[]');l.unshift({ts:Date.now(),tid,lbl:t.label,from,to});if(l.length>50)l.pop();localStorage.setItem('ob_log',JSON.stringify(l));}catch(e){}
}
function getLog(){try{return JSON.parse(lg('ob_log')||'[]')}catch(e){return[]}}
function getFiltered(){
  const f=S.filters;
  return TASKS.filter(t=>{
    const s=getSt(t);
    if(f.status!=='all'&&s!==f.status)return false;
    if(f.vendor!=='all'){if(f.vendor==='unassigned'&&t.owner!==null)return false;if(f.vendor!=='unassigned'&&t.owner!==f.vendor)return false;}
    if(f.phase!=='all'&&t.phase!==f.phase)return false;
    return true;
  });
}

// ── HELPERS ──
const dBetween=(a,b)=>Math.round((b-a)/86400000);
const dLeft=(d)=>dBetween(TODAY,new Date(d));
const fmtD=(s)=>{const d=new Date(s);return`${d.getMonth()+1}/${d.getDate()}`};
function fmtAgo(ts){if(!ts)return'';const m=Math.floor((Date.now()-Number(ts))/60000);if(m<1)return'방금';if(m<60)return`${m}분 전`;if(m<1440)return`${Math.floor(m/60)}h 전`;return`${Math.floor(m/1440)}d 전`}
const SL={done:'완료','in-progress':'진행',waiting:'대기',blocked:'막힘'};
const SI={done:'✓','in-progress':'↻',waiting:'○',blocked:'✕'};
const SC={done:'done','in-progress':'in-progress',waiting:'waiting',blocked:'blocked'};
function chip(s){return`<span class="sc ${SC[s]}" role="img" aria-label="${SL[s]}"><span aria-hidden="true">${SI[s]}</span> ${SL[s]}</span>`}
const PCOL={done:'#15803D','in-progress':'#1D4ED8',waiting:'#D1D5DB'};
const SCOL={done:'#15803D','in-progress':'#1D4ED8',waiting:'#9CA3AF',blocked:'#DC2626'};
function trend(p){
  if(p.status==='done')return'✓';if(p.status==='waiting')return'—';
  const el=dBetween(new Date(p.start),TODAY)/dBetween(new Date(p.start),new Date(p.due))*100;
  const d=p.progress-el;return d>=5?'↑':d<=-15?'↓':'→';
}
function trendColor(v){return v==='↑'?'#15803D':v==='↓'?'#DC2626':'#6B7280'}

function render(){

    el.addEventListener('blur',()=>{try{localStorage.setItem('ob_n_'+el.dataset.tid,el.value)}catch(e){}});
  });
}

function rHdr(){

}

function rKPI(){
  const all=TASKS, st=all.map(t=>getSt(t));
  const doneN=st.filter(s=>s==='done').length;
  const progN=st.filter(s=>s==='in-progress').length;
  const blkN=st.filter(s=>s==='blocked').length;
  const d1=all.filter(t=>t.phase==='D1');
  const d1d=d1.filter(t=>getSt(t)==='done').length;
  const rem=dLeft('2026-06-30');
  return`<div class="kpi">
<div class="kc ${blkN>0?'red':'grn'}"><div class="kc-lbl">블로커</div><div class="kc-val">${blkN}</div><div class="kc-sub">즉시 조치 필요</div></div>
<div class="kc blu"><div class="kc-lbl">D1 완료율</div><div class="kc-val">${Math.round(d1d/d1.length*100)}%</div><div class="kc-sub">${d1d}/${d1.length} 태스크</div></div>
<div class="kc blu"><div class="kc-lbl">진행중</div><div class="kc-val">${progN}</div><div class="kc-sub">활성 태스크</div></div>
<div class="kc ${rem<=7?'red':'grn'}"><div class="kc-lbl">D1 마감까지</div><div class="kc-val">D-${rem}</div><div class="kc-sub">6/30 기준</div></div>
</div>`;
}

function rFB(){
  const f=S.filters;
  const hasF=f.status!=='all'||f.vendor!=='all'||f.phase!=='all';
  const sOpts=[{v:'all',l:'전체'},{v:'done',l:'완료'},{v:'in-progress',l:'진행'},{v:'waiting',l:'대기'},{v:'blocked',l:'막힘'}];
  const pOpts=[{v:'all',l:'전체'},{v:'D1',l:'D1'},{v:'D2',l:'D2'}];
  const vOpts=[{v:'all',l:'전체'},...VENDORS.map(v=>({v:v.id,l:v.name})),{v:'unassigned',l:'미배정'}];
  const views=[{v:'swim',l:'🗂 스윔레인'},{v:'gantt',l:'📊 간트'},{v:'list',l:'📋 목록'}];
  return`<div class="fb">
<div class="fg"><span class="fl">상태</span>${sOpts.map(o=>`<button class="fc${f.status===o.v?' on':''}" onclick="setF('status','${o.v}')">${o.l}</button>`).join('')}</div>
<div class="fsep"></div>
<div class="fg"><span class="fl">Phase</span>${pOpts.map(o=>`<button class="fc${f.phase===o.v?' on':''}" onclick="setF('phase','${o.v}')">${o.l}</button>`).join('')}</div>
<div class="fsep"></div>
<div class="fg"><span class="fl">벤더</span>${vOpts.map(o=>`<button class="fc${f.vendor===o.v?' on':''}" onclick="setF('vendor','${o.v}')">${o.l}</button>`).join('')}</div>
${hasF?`<button class="clr" onclick="clrF()">✕ 초기화</button>`:''}
<div class="vg">${views.map(o=>`<button class="vb${S.view===o.v?' on':''}" onclick="setV('${o.v}')">${o.l}</button>`).join('')}</div>
</div>`;
}

function rAlert(){
  const bl=TASKS.filter(t=>getSt(t)==='blocked');
  const pg=GATES.filter(g=>g.status==='pending');
  if(!bl.length&&!pg.length)return'';
  const lines=[...bl.map(t=>`<b>${t.label}</b>${t.blocker?' — '+t.blocker:''}`),
               ...pg.map(g=>`<b>미결 게이트: ${g.label}</b> — ${g.note}`)];
  return`<div class="alert"><span style="font-size:15px;flex-shrink:0">🚨</span><div class="al-txt">지금 막힌 항목 / 미결 게이트<br><span>${lines.join('<br>')}</span></div></div>`;
}

function rGates(){
  return`<div class="card"><div class="ch"><span>▲</span>의사결정 게이트</div><div class="cb"><div class="gg">
${GATES.map(g=>{
  const on=S.activeGate===g.id;
  const stag=g.status==='resolved'?`<span class="stag ok">✓ ${g.resolution}</span>`:`<span class="stag pend">⚠ 미결정</span>`;
  return`<button class="gb${on?' on':''}" onclick="togG('${g.id}')" aria-pressed="${on}"><div class="gr">${g.icon} <span class="gl">${g.label}</span>${stag}</div><div class="gn">${g.note}</div><div class="ga">▸ 영향 태스크 ${g.affects.length}개${on?' — 하이라이트 ON':' — 클릭하면 하이라이트'}</div></button>`;
}).join('')}
</div></div></div>`;
}

function rTL(){
  const S0=new Date('2026-04-01'),E0=new Date('2026-09-30');
  const tot=dBetween(S0,E0);
  const pN=s=>dBetween(S0,new Date(s))/tot*100;
  const segs=PHASES.map(p=>{const l=pN(p.start),w=pN(p.due)-l,c=PCOL[p.status],op=p.status==='waiting'?.4:.85;return`<div class="tls" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%;background:${c};opacity:${op}"></div>`;}).join('');
  const td=pN(TODAY_STR);
  const markers=PHASES.map(p=>{const l=pN(p.due),c=PCOL[p.status];return`<div class="tlm" style="left:${l.toFixed(2)}%;top:-2px"><div class="tlm-id" style="color:${c}">${p.id}</div><div class="tlm-dot" style="background:${c}"></div><div class="tlm-dt">${fmtD(p.due)}</div></div>`;}).join('');
  const cards=PHASES.map(p=>{
    const rem=dLeft(p.due),isCur=p.status==='in-progress',isDone=p.status==='done';
    const c=PCOL[p.status],tr=trend(p),tc=trendColor(tr);
    const dLbl=isDone?`완료 (${fmtD(p.due)})`:isCur?`${fmtD(p.due)} 마감 · ${rem}일 후`:`목표 ${fmtD(p.due)}`;
    return`<div class="pc${isCur?' cur':''}">
${!isDone?`<div class="ra" style="color:${tc}" title="추세">${tr}</div>`:''}
<div class="pc-id" style="color:${c}">${p.id}</div>
<div class="pc-nm">${p.label}</div>
<div class="pc-sb">${p.sub}${p.note?' · '+p.note:''}</div>
<div class="pc-due${isCur&&rem<=7?' urg':''}">${dLbl}</div>
<div class="pw"><div class="pf" style="width:${p.progress}%;background:${c}"></div></div>
<div class="pp" style="color:${c}">${p.progress}%</div>
</div>`;
  }).join('');
  return`<div class="card"><div class="ch"><span>▶</span>Phase 타임라인</div><div class="cb">
<div class="tl"><div class="tlw"><div class="tlt">${segs}<div class="tld" style="left:${td.toFixed(2)}%;top:-18px;height:44px"><div class="tld-tip">TODAY</div></div>${markers}</div></div>
<div class="tlr">${['4/1','5/1','6/1','7/1','8/1','9/1','9/30'].map(l=>`<span>${l}</span>`).join('')}</div>
</div><div class="pcs">${cards}</div></div></div>`;
}

function rContent(){
  if(S.view==='gantt')return rGantt();
  if(S.view==='list') return rList();
  return rSwim();
}

function rSwim(){
  const fids=new Set(getFiltered().map(t=>t.id));
  const bv={};VENDORS.forEach(v=>{bv[v.id]=[];});
  const un={D1:[],D2:[]};
  TASKS.forEach(t=>{if(!fids.has(t.id))return;t.owner&&bv[t.owner]?bv[t.owner].push(t):un[t.phase]&&un[t.phase].push(t);});
  const secs=[{ph:'D1',label:'D1 — 시작품 2nd (~6/30)',vs:VENDORS.filter(v=>v.phases.includes('D1'))},{ph:'D2',label:'D2 — 시제품 1st (~8/30)',vs:VENDORS.filter(v=>v.phases.includes('D2'))}];
  const pf=S.filters.phase;
  return`<div class="card"><div class="ch"><span>◈</span>벤더 Swim Lane</div>
${secs.filter(s=>pf==='all'||pf===s.ph).map(sec=>`
<div class="pgl">${sec.label}</div>
${sec.vs.map(v=>{
  const ts=bv[v.id]||[];
  const bl=ts.filter(t=>getSt(t)==='blocked').length;
  const dn=ts.filter(t=>getSt(t)==='done').length;
  if(!ts.length)return`<div class="sl"><div class="lh"><div class="vd" style="background:${v.color}"></div><div class="vn">${v.name}</div><span class="tc2" style="margin-left:auto">필터 없음</span></div></div>`;
  return`<div class="sl"><div class="lh"><div class="vd" style="background:${v.color}"></div><div class="vn">${v.name}</div>${v.phases.map(p=>`<span class="pp2">${p}</span>`).join('')}${bl?`<span class="bw">⛔ ${bl}</span>`:''}<span class="tc2">${dn}/${ts.length}</span></div><div class="lb">${ts.map(rTK).join('')}</div></div>`;
}).join('')}
${(()=>{const ts=un[sec.ph];if(!ts||!ts.length)return'';return`<div class="uw"><div class="ul">${sec.ph} 기타 태스크</div><div class="ut">${ts.map(rTK).join('')}</div></div>`;})()}
`).join('')}
</div>`;
}

function rTK(task){
  const eff=getSt(task);
  const hl=S.activeGate&&GATES.find(g=>g.id===S.activeGate)?.affects.includes(task.id);
  const gd=task.gate?GATES.find(g=>g.id===task.gate):null;
  const no=S.noteOpen===task.id;
  const nt=getNote(task.id);
  const upd=getUpd(task.id);
  const icp=CP.has(task.id);
  const nxt={done:'in-progress','in-progress':'waiting',waiting:'blocked',blocked:'done'}[eff];
  return`<div class="tk s-${eff}${hl?' hl':''}${icp?' cp':''}" id="tc-${task.id}">
<div class="tk-top">${chip(eff)}${task.qty?`<span class="sc-qty">${task.qty}</span>`:''}<div class="tka"><button class="ib" onclick="togN('${task.id}')" title="메모">✏</button><button class="ib" onclick="cycS('${task.id}')" title="→ ${SL[nxt]}">⇄</button></div></div>
<div class="tk-lbl">${task.label}</div>
<div class="tk-meta"><span class="tk-ph">${task.phase}</span>${icp?`<span class="tk-cp">★ 크리티컬</span>`:''}${upd?`<span class="tk-upd">${fmtAgo(upd)}</span>`:''}</div>
${task.blocker&&eff!=='done'?`<div class="blk"><span aria-hidden="true">⛔</span><span>${task.blocker}</span></div>`:''}
${gd?`<div class="gba">🔀 ${gd.label}</div>`:''}
${no||nt?`<div class="na"><div class="nl">메모</div>${no?`<textarea class="ni" data-tid="${task.id}">${nt}</textarea><button class="ns" onclick="svN('${task.id}')">저장</button>`:`<div class="nd" onclick="togN('${task.id}')">${nt||'메모 추가...'}</div>`}</div>`:''}
</div>`;
}

function rGantt(){
  const S0=new Date('2026-04-01'),E0=new Date('2026-09-30');
  const tot=dBetween(S0,E0);
  const pN=s=>Math.max(0,Math.min(100,dBetween(S0,new Date(s))/tot*100));
  const td=pN(TODAY_STR);
  const fids=new Set(getFiltered().map(t=>t.id));
  const pf=S.filters.phase;
  const months=['4월','5월','6월','7월','8월','9월'];
  let rows='';
  ['D1','D2'].forEach(ph=>{
    if(pf!=='all'&&pf!==ph)return;
    const pts=TASKS.filter(t=>t.phase===ph&&fids.has(t.id));
    if(!pts.length)return;
    rows+=`<div class="g-row g-sep"><div class="g-lbl" style="width:200px"><span style="font-size:10px;font-weight:800;color:var(--text3);letter-spacing:.06em;padding-left:4px">${ph}</span></div><div class="g-trk"><div class="g-td" style="left:${td.toFixed(2)}%"></div></div></div>`;
    pts.forEach(t=>{
      const eff=getSt(t);
      const l=pN(t.est.s),w=Math.max(0.5,pN(t.est.e)-l);
      const v=t.owner?VENDORS.find(x=>x.id===t.owner):null;
      const icp=CP.has(t.id);
      rows+=`<div class="g-row">
<div class="g-lbl" style="width:200px"><div class="vd" style="background:${v?v.color:'var(--border)'}"></div>${chip(eff)}<div class="g-lt" title="${t.label}">${t.label}</div></div>
<div class="g-trk"><div class="g-td" style="left:${td.toFixed(2)}%"></div><div class="g-bar" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%;background:${SCOL[eff]};${icp?'outline:1.5px solid #F59E0B;outline-offset:1px':''}" title="${t.label} (${fmtD(t.est.s)}~${fmtD(t.est.e)})">${w>8?t.label.slice(0,10):''}</div></div>
</div>`;
    });
  });
  return`<div class="card"><div class="ch"><span>📊</span>간트 차트 <span style="font-size:9px;color:var(--text3);font-weight:400;margin-left:4px">예상 일정 · ★ 크리티컬 패스</span></div>
<div class="gw"><div class="g-hdr">${months.map(m=>`<div class="g-mo">${m}</div>`).join('')}</div>${rows}</div></div>`;
}

function rList(){
  const filtered=getFiltered();
  const ord={blocked:0,'in-progress':1,waiting:2,done:3};
  const sorted=[...filtered].sort((a,b)=>(ord[getSt(a)]??9)-(ord[getSt(b)]??9)||a.phase.localeCompare(b.phase));
  if(!sorted.length)return`<div class="card"><div class="cb" style="text-align:center;color:var(--text3);padding:24px">해당 조건의 태스크가 없습니다.</div></div>`;
  const nxt={done:'in-progress','in-progress':'waiting',waiting:'blocked',blocked:'done'};
  const rows=sorted.map(t=>{
    const eff=getSt(t);const v=t.owner?VENDORS.find(x=>x.id===t.owner):null;const gd=t.gate?GATES.find(g=>g.id===t.gate):null;const nt=getNote(t.id);const icp=CP.has(t.id);const upd=getUpd(t.id);
    return`<tr class="${eff==='blocked'?'s-b':eff==='in-progress'?'s-p':''}">
<td><span style="font-family:var(--mono);font-size:10px">${t.phase}</span></td>
<td>${chip(eff)}</td>
<td>${v?`<span style="display:inline-flex;align-items:center;gap:4px"><span class="vd" style="background:${v.color}"></span>${v.name}</span>`:`<span style="color:var(--text3)">미배정</span>`}</td>
<td><span style="font-weight:500">${t.label}</span>${icp?`<span class="tk-cp" style="margin-left:5px">★</span>`:''}${t.qty?`<span class="sc-qty" style="margin-left:4px">${t.qty}</span>`:''}${t.blocker&&eff!=='done'?`<div style="font-size:10px;color:#7F1D1D;margin-top:2px">⛔ ${t.blocker}</div>`:''}${gd?`<div class="gba" style="margin-top:3px">🔀 ${gd.label}</div>`:''}${nt?`<div style="font-size:10px;color:var(--text2);margin-top:2px">✏ ${nt}</div>`:''}</td>
<td><span style="font-size:9px;font-family:var(--mono);color:var(--text3)">${fmtD(t.est.s)}–${fmtD(t.est.e)}</span>${upd?`<br><span style="font-size:9px;font-family:var(--mono);color:var(--text3)">${fmtAgo(upd)}</span>`:''}</td>
<td><button class="ib" onclick="cycS('${t.id}')" title="→ ${SL[nxt[eff]]}">⇄</button><button class="ib" onclick="togN('${t.id}')" title="메모">✏</button></td>
</tr>`;
  }).join('');
  return`<div class="card"><div class="ch"><span>📋</span>목록 뷰 — ${sorted.length}개</div>
<div style="overflow-x:auto;padding:14px"><table class="ltb"><thead><tr><th>Phase</th><th>상태</th><th>벤더</th><th>태스크</th><th>기간</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function rLog(){
  const log=getLog(),cnt=log.length;
  return`<div style="margin-bottom:10px">
<button class="at-btn" onclick="togLog()"><span>🕐</span> 변경 이력<span class="at-cnt">${cnt}건</span><span style="margin-left:4px">${S.showLog?'▲':'▼'}</span></button>
${S.showLog?`<div class="al-box">${!cnt?`<div class="ai" style="color:var(--text3);font-style:italic">이력 없음. ⇄ 버튼으로 상태 변경 시 기록됩니다.</div>`:log.map(e=>`<div class="ai"><span class="ai-t">${fmtAgo(e.ts)}</span><span style="flex:1">${e.lbl}</span><span class="ai-f">${SL[e.from]||e.from}</span><span style="color:var(--text3);margin:0 3px">→</span><span class="ai-to ${SC[e.to]||''}">${SL[e.to]||e.to}</span></div>`).join('')}</div>`:''}
</div>`;
}

function rLegend(){
  return`<div class="card"><div class="lgd">
${['done','in-progress','waiting','blocked'].map(s=>`<div class="li">${chip(s)}</div>`).join('')}
<div class="li" style="color:#D97706">★ 크리티컬 패스</div>
<div class="li" style="color:var(--text3)">↑→↓ 추세 · ⇄ 상태 토글 · ✏ 메모 · localStorage 저장</div>
<div style="margin-left:auto;font-size:10px;color:var(--text3)">색+아이콘 병행 · WCAG AA</div>
</div></div>`;
}

// ── EVENTS ──
function togG(id){S.activeGate=(S.activeGate===id?null:id);render()}
function cycS(tid){
  const t=TASKS.find(x=>x.id===tid);if(!t)return;
  const cur=getSt(t),nxt={done:'in-progress','in-progress':'waiting',waiting:'blocked',blocked:'done'}[cur]||'waiting';
  logAct(tid,cur,nxt);try{localStorage.setItem('ob_s_'+tid,nxt);localStorage.setItem('ob_u_'+tid,Date.now())}catch(e){}
  render();
}
function togN(tid){S.noteOpen=(S.noteOpen===tid?null:tid);render();if(S.noteOpen)setTimeout(()=>{const el=document.querySelector(`.ni[data-tid="${tid}"]`);if(el)el.focus()},50)}
function svN(tid){const el=document.querySelector(`.ni[data-tid="${tid}"]`);if(el)try{localStorage.setItem('ob_n_'+tid,el.value)}catch(e){}; S.noteOpen=null;render()}
function setF(k,v){S.filters[k]=v;render()}
function clrF(){S.filters={status:'all',vendor:'all',phase:'all'};render()}
function setV(v){S.view=v;render()}
function togLog(){S.showLog=!S.showLog;render()}

render();
</script>
</body>
